services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      JOB_DB_PATH: /app/data/jobs.db
      CHECKPOINT_DB_PATH: /app/data/checkpoints.db
    volumes:
      - research-data:/app/data   # SQLite job store + graph checkpoints survive restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  research-data:
